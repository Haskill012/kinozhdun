services:
  kinozhdun-bot:
    build: .
    container_name: kinozhdun_bot
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
      - 77.88.8.8
    env_file:
      - .env
    volumes:
      - ./data:/app/data

  kinozhdun-site:
    build: .
    container_name: kinozhdun_site
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
      - 77.88.8.8
    command: ["python", "-m", "website"]
    env_file:
      - .env
    environment:
      SITE_HOST: 0.0.0.0
      SITE_PORT: 8099
    expose:
      - "8099"
    volumes:
      - ./data:/app/data

  caddy:
    image: caddy:alpine
    container_name: kinozhdun_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
