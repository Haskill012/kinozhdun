<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="lime-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#d4fa58" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="128" height="128" rx="28" fill="#111312"/>
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="#30342f" stroke-width="1.5"/>
  <rect x="4" y="4" width="120" height="120" rx="24" fill="none" stroke="#d4fa58" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Brand Asterisk Star -->
  <g transform="translate(98, 26)" filter="url(#lime-glow)">
    <path d="M0 -10 L0 10 M-10 0 L10 0 M-7 -7 L7 7 M-7 7 L7 -7" stroke="#d4fa58" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.5" fill="#d4fa58"/>
  </g>

  <!-- Zhdun Silhouette / Minimalist Cinema Mascot -->
  <g fill="none" stroke="#d4fa58" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Head and Snout -->
    <!-- Dome of head -->
    <path d="M 46 44 C 46 24 82 24 82 44 C 82 50 80 54 78 57 C 78 65 74 72 64 72 C 54 72 50 65 50 57 C 48 54 46 50 46 44 Z" fill="#1a1d1b" stroke="#d4fa58" stroke-width="3.5"/>
    
    <!-- Proboscis / Nose folds -->
    <path d="M 58 57 Q 64 63 70 57" stroke="#d4fa58" stroke-width="2"/>
    <path d="M 60 62 Q 64 66 68 62" stroke="#d4fa58" stroke-width="2"/>

    <!-- Neck rolls / folds -->
    <path d="M 45 66 Q 64 73 83 66" stroke="#d4fa58" stroke-width="2.5"/>
    <path d="M 40 75 Q 64 82 88 75" stroke="#d4fa58" stroke-width="2.5"/>

    <!-- Body Outline -->
    <path d="M 40 75 C 32 84 26 98 26 112 C 26 115 28 116 32 116 L 96 116 C 100 116 102 115 102 112 C 102 98 96 84 88 75" fill="#181c19" stroke="#d4fa58" stroke-width="3.5"/>

    <!-- Clasped Hands (Waiting Pose) -->
    <!-- Left Arm -->
    <path d="M 32 94 C 36 104 46 106 58 103" stroke="#d4fa58" stroke-width="3"/>
    <!-- Right Arm -->
    <path d="M 96 94 C 92 104 82 106 70 103" stroke="#d4fa58" stroke-width="3"/>
    <!-- Interlocked fingers -->
    <path d="M 54 100 Q 64 94 74 100 Q 64 108 54 100 Z" fill="#d4fa58" stroke="#d4fa58" stroke-width="1.5"/>
    <path d="M 58 103 Q 64 99 70 103" stroke="#111312" stroke-width="2"/>

    <!-- 3D Cinema Glasses -->
    <!-- Frame -->
    <rect x="42" y="36" width="44" height="16" rx="4" fill="#111312" stroke="#d4fa58" stroke-width="3"/>
    <line x1="64" y1="36" x2="64" y2="44" stroke="#d4fa58" stroke-width="2.5"/>
    <!-- Lenses -->
    <rect x="46" y="39" width="15" height="10" rx="2" fill="#d4fa58" fill-opacity="0.85" stroke="none"/>
    <rect x="67" y="39" width="15" height="10" rx="2" fill="#f4f4ec" fill-opacity="0.9" stroke="none"/>
  </g>
</svg>
